services:
  - type: web
    runtime: node
    name: monazzam-api
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: monazzam-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: static
    name: monazzam-web
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: monazzam-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: cron
    runtime: node
    name: monazzam-reminders
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run job:reminders
    schedule: "* * * * *"
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false

  - type: cron
    runtime: node
    name: monazzam-recurring
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run job:recurring
    schedule: "*/5 * * * *"
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
